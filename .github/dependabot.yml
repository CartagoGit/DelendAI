# dependabot.yml — f00050 S8.
#
# Automated dependency updates for the delendai monorepo.
# Two ecosystems are in scope:
#   - `npm`    → covers the bun-managed `package.json` workspaces
#                (packages/*, plugins/*, apps/*, extensions/*, examples/*).
#                Dependabot opens PRs against the manifest; `bun install`
#                regenerates `bun.lock`.
#   - `github-actions` → keeps `.github/workflows/*.yml` on current
#                action SHAs.
#
# Every update is a PR that the `CI` workflow gates, so a broken upgrade
# cannot land silently.
#
# `target-branch` is the integration branch, not the default one.
# Dependabot targets the repository default when nothing says otherwise,
# and that is `main` here — so four bumps sat for days against the RELEASE
# boundary, needing the human approval that boundary requires and never
# going through integration at all. Under this development model `main` is
# reached by promoting `develop`, never by landing work on it directly,
# and a dependency bump is work like any other.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
