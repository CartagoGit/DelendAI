branches:
  develop:
    enforce_admins: true
    required_pull_request_reviews: null
    required_status_checks:
      strict: true
      contexts:
        - lint-biome
        - lint-architecture
        - lint-presets
        - lint-docs
        - lint-security
        - lint-governance
        - typecheck
        - tests
        - quality-gate
        - verify-runtime
        - tokens-budget-real
        - manifests-check
        - generated-artifacts-check
        - web site build
        - pack smoke (publishable packages)
        - metrics longitudinal regression gate (f00027)
