version: 1
branches:
    - name: main
      protection:
          required_status_checks:
              strict: true
              contexts:
                  - ci-complete
                  - release-pr-gate
          enforce_admins: true
          required_linear_history: true
          allow_force_pushes: false
          allow_deletions: false
          restrictions: null
    - name: develop
      protected: false
      protection:
          required_status_checks:
              strict: false
              contexts: []
          enforce_admins: false
          required_linear_history: false
          allow_force_pushes: false
          allow_deletions: false
          restrictions: null
