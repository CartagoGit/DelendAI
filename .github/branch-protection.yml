version: 1
branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        contexts:
          - quality-gate
          - tests
          - tokens
          - governance
          - security
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
  - name: develop
    protection:
      required_status_checks:
        strict: true
        contexts:
          - quality-gate
          - tests
          - tokens
          - governance
          - security
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null