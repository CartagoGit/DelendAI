# test-budget-calibration.yml — c00537: long-standing test budgets follow
# what CI measures.
#
# A budget is ceil(1.5 x the longest time CI measured for that test). The
# integration branch's runs upload those times per shard (`test-durations-*`,
# 14 days); weekly, this reads the last runs of develop and raises every
# budget declared below what they measured (never lowers one), then keeps the
# change as a patch artifact and names it in an issue (no pull request is opened
# with the workflow token; the integrator identity of q00048 S6 may take that over).

name: test-budget-calibration

on:
    schedule:
        - cron: '0 4 * * 1' # Mondays at 04:00 UTC
    workflow_dispatch:
        inputs:
            runs:
                description: How many of develop's last CI runs to read
                default: '10'

permissions:
    contents: read
    issues: write
    actions: read

concurrency:
    group: test-budget-calibration
    cancel-in-progress: true

jobs:
    calibrate:
        name: calibrate test budgets from develop
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: develop

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Raise the budgets CI measured over
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUNS: ${{ inputs.runs || '10' }}
              run: bun run test:budgets:calibrate --from-develop="$RUNS" --update

            - name: Keep the calibration as a patch
              id: patch
              run: |
                  set -euo pipefail
                  git diff > calibration.patch
                  if [ -s calibration.patch ]; then echo "changed=1" >> "$GITHUB_OUTPUT"; fi

            - name: Upload the calibration patch
              if: ${{ steps.patch.outputs.changed == '1' }}
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: test-budget-calibration
                  path: calibration.patch
                  retention-days: 30

            # The workflow token opens no pull request here: one it opens starts
            # no checks. The change is carried as the patch above and named in an
            # issue; applying it is one `git apply` on a branch.
            - name: Say where the calibration is
              if: ${{ steps.patch.outputs.changed == '1' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUN: ${{ github.run_id }}
              run: >-
                  gh issue create --repo "${GITHUB_REPOSITORY}"
                  --title "Test budgets: a calibration from develop's last CI runs is ready"
                  --body "The patch is the artifact test-budget-calibration of run ${RUN}: git apply it on a branch."
