# test-budget-calibration.yml — c00537: long-standing test budgets follow
# what CI measures.
#
# A budget is ceil(1.5 x the longest time CI measured for that test). The
# integration branch's runs upload those times per shard (`test-durations-*`,
# 14 days); weekly, this reads the last runs of develop and raises every
# budget declared below what they measured (never lowers one), then opens or
# refreshes one pull request with the new numbers.

name: test-budget-calibration

on:
    schedule:
        - cron: '0 4 * * 1' # Mondays at 04:00 UTC
    workflow_dispatch:
        inputs:
            runs:
                description: How many of develop's last CI runs to read
                default: '10'

permissions:
    contents: write
    pull-requests: write
    actions: read

concurrency:
    group: test-budget-calibration
    cancel-in-progress: true

jobs:
    calibrate:
        name: calibrate test budgets from develop
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: develop

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Raise the budgets CI measured over
              env:
                  GH_TOKEN: ${{ github.token }}
                  RUNS: ${{ inputs.runs || '10' }}
              run: bun run test:budgets:calibrate --from-develop="$RUNS" --update

            - name: Open or refresh the calibration pull request
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail
                  if git diff --quiet; then
                    echo "Every budget holds what develop measured."
                    exit 0
                  fi
                  branch=delendai/pr/ci/calibrate/test-budgets
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git switch -c "$branch"
                  git commit -qam "test: calibrate budgets from develop's last CI runs"
                  git push -f origin "$branch"
                  if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
                    gh pr create --base develop --head "$branch" \
                      --title "test: calibrate budgets from develop's last CI runs" \
                      --body "ceil(1.5 x the longest time develop's last CI runs measured), for every test declaring less (run ${GITHUB_RUN_ID})."
                  fi
