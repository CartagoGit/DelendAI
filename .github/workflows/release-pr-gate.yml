# release-pr-gate.yml — f00395 S4 / S5.
#
# Required status check on `main` (see `.github/branch-protection.yml`).
# Runs the release-pr-gate locally so a single failure blocks the merge.
# Mirrors the local pre-push gate in `lefthook.yml` for defense in depth:
# local catches before push, CI confirms at PR time.
#
# Triggers:
#   pull_request to main.
#   workflow_dispatch (manual reruns).

name: release-pr-gate

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, ready_for_review]
    workflow_dispatch:

concurrency:
    group: release-pr-gate-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    # Reading the alerts open on the promotion's head branch.
    security-events: read

jobs:
    release-pr-gate:
        name: release-pr-gate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Typecheck
              run: bun run typecheck

            - name: Lint (Biome)
              run: bun run lint

            # The pull request's own CodeQL check fails only from a severity
            # threshold up, so alerts below it reach the integration branch;
            # none of them reaches the release branch.
            - name: The promotion carries no open code scanning alert
              if: ${{ github.event_name == 'pull_request' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run forge:promotion-alerts
