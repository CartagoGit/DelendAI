# pack-smoke.yml — x00268 (Track G, audit §32).
#
# Wraps the existing pack-smoke job from ci.yml so the full
# command output is preserved on failure. The audit's flagged
# bug was that the old `set -euo pipefail` + command-substitution
# shape aborted before the diagnostic `echo` could run, leaving
# the job's log with only the generic set-e abort line — no
# actual evidence of what the smoke check failed on.
#
# The new wrapper (`tools/scripts/ci/pack-smoke.script.ts`) captures
# everything to a temp file, includes spawn errors in the output,
# prints it inside `::group::` even on failure, and exits with the
# inner command's code. The
# workflow below is just the runner glue.
#
# Triggers:
#   workflow_dispatch (manual reruns).
#   tier3 (c00139) calls this script via `bun tools/scripts/ci/pack-smoke.script.ts`.
#   When a dedicated schedule + PR trigger is needed, copy this
#     workflow and adjust the `on:` block — the wrapper is the
#     contract; the trigger surface is incidental.

name: pack-smoke

on:
    workflow_dispatch:

concurrency:
    group: pack-smoke-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    pack-smoke:
        name: pack-smoke
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build dist (required for tarball install)
              # The `files: ["dist"]` field in each package.json means
              # the tarballs are empty until the build runs.
              run: bun run build

            - name: Run pack-smoke (output preserved on failure)
              # The script captures the full output via `::group::` and
              # exits with the inner command's code, so a failing step
              # leaves the run log with the evidence a developer needs
              # to triage without re-running locally.
              run: bun tools/scripts/ci/pack-smoke.script.ts
