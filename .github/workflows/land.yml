name: land

# GENERATED from the land workflow template (renderLandWorkflow); edit the
# project values, not this file. The one integration actor: a stateless
# pass over the ready pull requests (merge what does not overlap, batch
# what does, label the culprit of a red batch), the promotion after the
# integration branch's CI, the forward sync after the release branch moves,
# and the upkeep. It keeps nothing; every pass reads the forge. It acts as
# the identity the policy names and never as the workflow token. It exists
# because the policy says `development.integration.engine: land`.

on:
    push:
        branches: [develop, main]
    schedule:
        - cron: '17 * * * *'
    workflow_dispatch:
        inputs:
            pr:
                description: The pull request whose event woke the pass; empty runs the full pass, and the pass reads them all.
                required: false
                default: ''
            derived:
                description: The pull request whose derived files conflict with the integration branch.
                required: false
                default: ''
            promote:
                description: Set when the integration branch CI ended green or red.
                required: false
                default: ''

# The workflow token only reads; every write uses the identity.
permissions:
    contents: read
    pull-requests: read
    checks: read
    actions: read

# One pending run per kind and branch; a run in progress is never cancelled.
# The run is named by its group, so a signal can see which kind is queued.
run-name: land-${{ (inputs.derived != '') && 'derived-' || (inputs.promote != '') && 'promote-' || (github.event_name == 'schedule') && 'upkeep-' || (github.event_name == 'push' && github.ref_name == 'main') && 'forward-sync-' || 'pass-' }}${{ github.ref_name }}
concurrency:
    group: land-${{ (inputs.derived != '') && 'derived-' || (inputs.promote != '') && 'promote-' || (github.event_name == 'schedule') && 'upkeep-' || (github.event_name == 'push' && github.ref_name == 'main') && 'forward-sync-' || 'pass-' }}${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    # A dispatch for a pull request event or its CI ending (an empty `pr`
    # included), or a push to the integration branch: re-read the forge and
    # settle every pull request.
    # On the schedule the same pass is the watchdog: work found there was a
    # missed event, so it fails and files the evidence.
    land:
        name: land
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote != '') && !(github.event_name == 'workflow_dispatch' && inputs.derived != '') && !(github.event_name == 'push' && github.ref_name == 'main') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Look for an event-driven pass in flight
              id: inflight
              if: ${{ github.event_name == 'schedule' }}
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: |
                n=$(gh run list --workflow land.yml --repo "${GITHUB_REPOSITORY}" \
                  --branch "${GITHUB_REF_NAME}" --limit 30 --json status,event,createdAt --jq \
                  '[.[] | select(.event != "schedule") | select(.status != "completed" or ((.createdAt | fromdateiso8601) > (now - 300)))] | length') || n=0
                echo "count=${n:-0}" >> "${GITHUB_OUTPUT}"

            - name: One pass
              id: pass
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  LAND_WATCHDOG: ${{ github.event_name == 'schedule' && steps.inflight.outputs.count == '0' && '1' || '' }}
                  LAND_WATCHDOG_EVIDENCE: ${{ runner.temp }}/land-watchdog.md
              run: |
                rc=0
                bun packages/cli/src/index.ts integration pass || rc=$?
                echo "rc=${rc}" >> "${GITHUB_OUTPUT}"
                exit "${rc}"

            - name: Reconcile the refs the pass left behind
              if: ${{ !cancelled() && github.event_name != 'schedule' }}
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: bun tools/scripts/forge/reconcile-refs.script.ts --apply --trigger=land-merge

            - name: Keep the one issue of a missed event
              if: ${{ !cancelled() && github.event_name == 'schedule' && steps.inflight.outputs.count == '0' }}
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  RC: ${{ steps.pass.outputs.rc }}
                  RUN: ${{ github.run_id }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  SHA: ${{ github.sha }}
                  EVIDENCE: ${{ runner.temp }}/land-watchdog.md
              run: |
                set -euo pipefail
                title="The watchdog found work no event had started"
                open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number")"
                if [ "${RC}" = "0" ]; then
                  for n in ${open}; do
                    gh issue close "${n}" --repo "${GITHUB_REPOSITORY}" --comment "A strict scheduled pass found nothing to do (run ${RUN} at ${SHA}): no event is missing."
                  done
                  exit 0
                fi
                [ "${RC}" = "1" ] || exit 0
                body="The scheduled pass acted, so an event was missed. Run ${RUN} (${RUN_URL})."$'\n\n'"$(cat "${EVIDENCE}" 2>/dev/null || true)"
                first=""
                for n in ${open}; do
                  if [ -z "${first}" ]; then first="${n}"; else gh issue close "${n}" --repo "${GITHUB_REPOSITORY}" --comment "Duplicate of #${first}."; fi
                done
                if [ -n "${first}" ]; then
                  gh issue edit "${first}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
                else
                  gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
                fi

    # A derived-file conflict, in two jobs. This one holds no token: it
    # runs the pull request's code, so it can only read, and hands its
    # result over as an artifact.
    derived-prepare:
        name: derived-prepare
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.derived != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Merge the integration branch and regenerate
              env:
                  DERIVED_PR: ${{ inputs.derived }}
              run: mkdir -p derived-out && bun tools/scripts/forge/derived-resolve.script.ts --phase=prepare --pr="${DERIVED_PR}" --out=derived-out

            - name: Hand the result over
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: derived-result
                  path: derived-out

    # This one holds the identity and runs none of the pull request's code:
    # it checks the artifact against its own merge and pushes, without force.
    derived-push:
        name: derived-push
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.derived != '' }}
        runs-on: ubuntu-latest
        needs: derived-prepare
        timeout-minutes: 10
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Fetch the result
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: derived-result
                  path: derived-out

            - name: Push it if the head did not move
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  DERIVED_PR: ${{ inputs.derived }}
              run: bun tools/scripts/forge/derived-resolve.script.ts --phase=push --pr="${DERIVED_PR}" --in=derived-out

    # The CI of the integration branch ended: promote it when it is green,
    # file one urgent repair when it is red. It blocks nobody.
    promote:
        name: promote
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote != '' }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Open the promotion if it is ready, or file its urgent repair
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: bun tools/scripts/forge/open-promotion.script.ts --apply

            - name: Revert the culprit merge of a red run as a repair
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: bun tools/scripts/forge/land-repair.script.ts

    # The release branch moved: carry it back into the integration branch.
    forward-sync:
        name: forward-sync
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Carry the release branch back into the integration branch
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  GIT_AUTHOR_NAME: delendai-integrator
                  GIT_AUTHOR_EMAIL: integrator@users.noreply.github.com
                  GIT_COMMITTER_NAME: delendai-integrator
                  GIT_COMMITTER_EMAIL: integrator@users.noreply.github.com
              run: bun run forge:forward-sync -- --apply

    # Upkeep on the schedule: every step runs, whatever the one before concluded.
    upkeep:
        name: upkeep
        if: ${{ github.event_name == 'schedule' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
            checks: read
            actions: read
            security-events: read
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  # The integrator pushes as its identity, never with this token.
                  persist-credentials: false

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  # Full history: a batch merges members onto the tip, and the
                  # promotion and the forward sync ask ancestry questions.
                  fetch-depth: '0'
                  persist-credentials: 'false'

            - name: Reconcile the refs, the periodic safety pass
              if: always()
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: bun tools/scripts/forge/reconcile-refs.script.ts --apply --trigger=upkeep

            - name: Fail while something hangs on the forge
              if: always()
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
              run: bun run work:doctor -- --forge

            - name: Fail while a code scanning alert is open on the integration branch
              if: always()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run forge:promotion-alerts -- --branch=develop --latest-analysed
