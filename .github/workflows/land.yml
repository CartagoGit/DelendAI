name: land

# GENERATED from the land workflow template (renderLandWorkflow); edit the
# project values, not this file. The one integration actor: a stateless
# pass over the ready pull requests (merge what does not overlap, batch
# what does, label the culprit of a red batch), the promotion after the
# integration branch's CI, the forward sync after the release branch moves,
# and the upkeep. It keeps nothing; every pass reads the forge. It exists
# because the policy says `development.integration.engine: land`.

on:
    workflow_run:
        workflows: [rehearsal-ci]
        types: [completed]
    check_suite:
        types: [completed]
    pull_request_target:
        types: [ready_for_review]
        branches: [delendai/rehearsal/r20261113-000719/one-pr-integration]
    push:
        branches: [delendai/rehearsal/r20261113-000719/one-pr-integration, main]
    schedule:
        - cron: '*/15 * * * *'
    workflow_dispatch:

# Concurrency 1; a waiting pass is kept, since the next reads what the
# cancelled one would have.
concurrency:
    group: land-rehearsal-r20261113-000719
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    issues: write
    checks: read
    actions: write
    security-events: read

jobs:
    land:
        name: land
        if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request') && !(github.event_name == 'push' && github.ref_name == 'main') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-bun-repo
              with:
                  fetch-depth: '0'

            - name: One pass
              env:
                  GH_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
              run: bun tools/scripts/forge/land.script.ts
