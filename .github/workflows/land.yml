name: land

# GENERATED from the land workflow template (renderLandWorkflow); edit the
# project values, not this file. The one integration actor: a stateless
# pass over the ready pull requests (merge what does not overlap, batch
# what does, label the culprit of a red batch), the promotion after the
# integration branch's CI, the forward sync after the release branch moves,
# and the upkeep. It keeps nothing; every pass reads the forge. It acts as
# the identity the policy names and never as the workflow token. It exists
# because the policy says `development.integration.engine: land`.

on:
    push:
        branches: [delendai/rehearsal/r20261114-161738/derived-conflict-integration, main]
    schedule:
        - cron: '*/15 * * * *'
    workflow_dispatch:
        inputs:
            pr:
                description: The pull request whose event woke the pass; empty runs the full pass, and the pass reads them all.
                required: false
                default: ''
            derived:
                description: The pull request whose derived files conflict with the integration branch.
                required: false
                default: ''
            promote:
                description: Set when the integration branch CI ended green or red.
                required: false
                default: ''

# The workflow token only reads; every write uses the identity.
permissions:
    contents: read
    pull-requests: read
    checks: read
    actions: read

jobs:
    # A dispatch for a pull request event or its CI ending (an empty `pr`
    # included), or a push to the integration branch: re-read the forge and
    # settle every pull request.
    # On the schedule the same pass is the watchdog: work found there was a
    # missed event, so it fails and files the evidence.
    land:
        name: land
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote != '') && !(github.event_name == 'workflow_dispatch' && inputs.derived != '') && !(github.event_name == 'push' && github.ref_name == 'main') }}
        concurrency:
            group: land-rehearsal-r20261114-161738
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-bun-repo
              with:
                  fetch-depth: '0'

            - name: One pass
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  LAND_WATCHDOG: ${{ github.event_name == 'schedule' && '1' || '' }}
              run: bun tools/scripts/forge/land.script.ts

            - name: File the evidence of a missed event
              if: ${{ failure() && github.event_name == 'schedule' }}
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  RUN: ${{ github.run_id }}
              run: >-
                  gh issue create --repo "${GITHUB_REPOSITORY}"
                  --title "The watchdog found work no event had started"
                  --body "The scheduled pass acted, so an event was missed. Run ${RUN}."

    # A derived-file conflict, in two jobs. This one holds no token: it
    # runs the pull request's code, so it can only read, and hands its
    # result over as an artifact.
    derived-prepare:
        name: derived-prepare
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.derived != '' }}
        concurrency:
            group: land-rehearsal-r20261114-161738-derived-prepare
            cancel-in-progress: false
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-bun-repo
              with:
                  fetch-depth: '0'

            - name: Merge the integration branch and regenerate
              env:
                  DERIVED_PR: ${{ inputs.derived }}
              run: mkdir -p derived-out && bun tools/scripts/forge/derived-resolve.script.ts --phase=prepare --pr="${DERIVED_PR}" --out=derived-out

            - name: Hand the result over
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: derived-result
                  path: derived-out

    # This one holds the identity and runs none of the pull request's code:
    # it checks the artifact against its own merge and pushes, without force.
    derived-push:
        name: derived-push
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.derived != '' }}
        concurrency:
            group: land-rehearsal-r20261114-161738-derived-push
            cancel-in-progress: false
        runs-on: ubuntu-latest
        needs: derived-prepare
        timeout-minutes: 10
        steps:
            - name: Mint the integrator identity token
              id: identity
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ vars.DELENDAI_APP_ID }}
                  private-key: ${{ secrets.DELENDAI_APP_PRIVATE_KEY }}

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: ./.github/actions/setup-bun-repo
              with:
                  fetch-depth: '0'

            - name: Fetch the result
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: derived-result
                  path: derived-out

            - name: Push it if the head did not move
              env:
                  GH_TOKEN: ${{ steps.identity.outputs.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  DERIVED_PR: ${{ inputs.derived }}
              run: bun tools/scripts/forge/derived-resolve.script.ts --phase=push --pr="${DERIVED_PR}" --in=derived-out
