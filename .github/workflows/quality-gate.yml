# quality-gate.yml — c00132 (AUD-P0-002).
#
# Required status check on `main` (see `.github/branch-protection.yml`). Runs
# the integrated quality gate so a release PR cannot merge with regressions.
#
# Triggers:
#   pull_request to main.
#   merge_group (queue).
#   workflow_dispatch (manual reruns).

name: quality-gate

on:
    pull_request:
        branches: [main]
    merge_group:
    workflow_dispatch:

concurrency:
    group: quality-gate-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality-gate:
        name: quality-gate
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                mode: [collect]
        timeout-minutes: 30
        steps:
            # Full history, and `proposal-cited-commits` is why.
            #
            # That gate asks whether every commit a closed proposal cites
            # is reachable from a PUBLISHED ref — deliberately, so its
            # verdict does not depend on whoever wrote the citation still
            # having it in their reflog. A shallow clone publishes almost
            # nothing, so `git rev-list --remotes --tags` came back nearly
            # empty and 339 perfectly good citations were reported as
            # orphans. The gate was not wrong about the repository; it was
            # wrong about what it could see.
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # The single source of truth for what "quality gate" means.
            # Adding a step here means it is now required to merge.
            - name: Run integrated quality gate
              env:
                  QUALITY_GATE_MODE: ${{ matrix.mode }}
              run: bun run quality:gate:ci

