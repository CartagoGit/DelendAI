name: rehearsal-scan

on:
    push:
        branches: ['delendai/rehearsal/r20261114-151436/develop-moving-integration']

permissions:
    contents: read

jobs:
    scan:
        name: rehearsal-scan
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: The push started a scan
              env:
                  SHA: ${{ github.sha }}
              run: echo "scanned $SHA"
