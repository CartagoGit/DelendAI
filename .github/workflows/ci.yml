name: CI

# The full matrix is the required validation boundary for `develop` and the
# strict release boundary for `main`. The aggregate job remains the single
# required status check declared in `.github/settings.yml`.
on:
    push:
        branches: [develop, main]
    pull_request:
        branches: [develop, main]
    # The merge queue runs this same matrix against the batch it intends
    # to merge, which is the only place the "up to date" requirement can
    # be satisfied without somebody refreshing every candidate by hand.
    #
    # WHY IT IS NEEDED HERE. `develop` requires candidates to be up to
    # date — that is what stops two independently green pull requests
    # combining into a red branch. The cost is that every merge makes
    # every other candidate stale, so landing N candidates took N CI
    # cycles and a human (or a bot, which is worse: the forge will not
    # build a bot's commit) to refresh each one in between. Measured on
    # this repository: six candidates, all green, none mergeable.
    #
    # A queue tests the combination instead of the members, which is the
    # thing the requirement was always about.
    merge_group:

# Pull requests may be superseded, but pushes to develop are never cancelled:
# a cancelled required job is not evidence of a green branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-biome:
        name: lint-biome
        runs-on: ubuntu-latest
        steps:
            # A `uses: ./path` step can only be resolved once the repo holding
            # that path is on disk, and setup-bun-repo's own first internal step
            # IS the checkout — so it can never bootstrap itself as a job's very
            # first step. Every job in this file failed here, with every later
            # step reported as `skipped`, from 2026-08-31 until this was added.
            # The composite action then re-checks out at whatever fetch-depth it
            # needs, so this bare one costs a shallow clone and nothing else.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run biome and style-entry lints
              run: |
                  set -euo pipefail
                  bun run lint
                  bun run lint:scss

    lint-architecture:
        name: lint-architecture
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run architecture lints
              run: |
                  set -euo pipefail
                  bun run lint:cli-imports
                  bun run lint:cli-coverage
                  bun run lint:architecture-readfile-via-safe-reader
                  bun run lint:tools
                  bun run lint:self-host-dogfood
                  bun run lint:solid
                  bun run lint:no-any
                  bun run lint:cli-shape
                  bun run lint:cli-ui-parity
                  bun run lint:shared-ui-ratchet
                  bun run lint:types-in-contracts
                  bun run lint:type-naming
                  bun run lint:test-unsafe-casts
                  bun run lint:effect-boundaries
                  bun run lint:file-conventions
                  bun run lint:exact-scope-checkpoint
                  bun run lint:forge-settings

    lint-presets:
        name: lint-presets
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Rebuild the proposal registry cache
              # A fresh checkout has no `.cache/delendai/proposals/index.json`
              # (gitignored — it's a derived cache, see r00010). `catalog:check`
              # below needs it to exist to resolve at all. This mirrors what the
              # MCP server does lazily on its own `auto_work`/`continue_proposal`
              # calls; it is NOT a proposal-integrity gate (that lives in
              # `lint-governance` via `lint:proposals`), so a nonzero exit here
              # (e.g. duplicate ids mid-swarm) must not fail this job.
              run: bun run sync:proposals || true

            - name: Run preset and release-surface checks
              run: |
                  set -euo pipefail
                  bun run lint:setup
                  bun run lint:dependency-versions
                  bun run lint:core-version-pin
                  bun run lint:feature-flags
                  bun run lint:compat-window
                  bun run verify:stable-manifest
                  bun run catalog:check
                  bun run catalog:hints:check

    lint-docs:
        name: lint-docs
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run docs, content and web lints
              run: |
                  set -euo pipefail
                  bun run lint:cli:i18n
                  bun run lint:style-integrity
                  bun run lint:content-integrity
                  bun run lint:web
                  bun run lint:workflow
                  bun run lint:brand-hex
                  bun run lint:skills
                  bun run lint:host-instructions
                  bun run lint:prompt-size

    lint-security:
        name: lint-security
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run security and hygiene lints
              run: |
                  set -euo pipefail
                  bun run lint:privacy
                  bun run lint:no-cleartext-secrets
                  bun run lint:ephemeral
                  bun run lint:stray-cache-files
                  bun run lint:no-tracked-ignored-files
                  # i00004: a .d.ts next to a .ts source is a build accident,
                  # and quality-gate.yml sat syntactically invalid for several
                  # audit cycles because no check parsed the workflows.
                  bun run lint:no-tracked-declarations
                  bun run lint:workflow-yaml
                  # A job that cannot run its own command line is the bug
                  # that took `delendai-validate` — the single required
                  # check on develop — down with exit 127 on every run.
                  # `lint:workflow-bootstrap` was only ever reachable via
                  # `validate:run`, i.e. never in CI; both run here now.
                  bun run lint:workflow-bootstrap
                  bun run lint:workflow-runner-bootstrap
                  # A candidate carries what an agent CHANGED, not what
                  # its machine contains. Three open candidates each
                  # carried a file named `node_modules` whose content was
                  # an absolute path on one laptop.
                  bun run lint:publication-scope -- --base=origin/${{ github.base_ref || 'develop' }}
                  # x00529: one proposal existing in two status folders at
                  # once hard-blocked sync_proposals for the whole repo.
                  bun run lint:proposal-uniqueness

    lint-governance:
        name: lint-governance
        runs-on: ubuntu-latest
        steps:
            # Full history: this job verifies that commits cited by proposals
            # actually exist. The default shallow checkout has none of them, so
            # every citation reads as dangling and the gate could never pass.
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo
              with:
                  fetch-depth: '0'

            - name: Run governance and proposal lints
              run: |
                  set -euo pipefail
                  bun run lint:proposals
                  bun run lint:mass-content-removal
                  bun run lint:scaffolds
                  bun run lint:agents
                  bun run lint:audit-ids
                  bun run lint:cache
                  bun run lint:proposal-id-drift
                  bun run lint:proposal-cited-commits
                  bun run lint:single-frontmatter
                  bun run lint:reap-legacy-proposals
                  bun run lint:closed-frozen-guard
                  bun run lint:user-markers
                  bun run lint:proposal-slice-completeness
                  bun run lint:commit-branch
                  bun run lint:push-to-develop
                  bun run lint:agent-branch-naming

    typecheck:
        name: typecheck
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Typecheck
              run: bun run typecheck

    # The suite used to run TWICE in one job: `bun run test` and then
    # `bun run test:coverage`, which is the same specs with coverage
    # instrumentation. Fourteen minutes of wall clock for one suite's worth
    # of information, on the critical path of every pull request.
    #
    # Now it runs once, sharded across machines. Coverage travels in each
    # shard's blob report and is merged in `tests` below.
    #
    # EIGHT and not four, measured rather than guessed. With four, the
    # shards took 8.3 / 8.7 / 9.0 / 9.2 minutes — balanced to within a
    # minute, so the split itself was not the problem; the number of
    # machines was. Each job pays roughly two minutes of fixed cost
    # (checkout, install, cache) and the rest is test work, so halving the
    # work per shard takes the critical path from ~9 minutes to ~5.
    #
    # There is a floor here: past a dozen shards the fixed cost dominates
    # and more machines buy nothing but queue time.
    #
    # The merge is EXACT, not approximate — measured before trusting it:
    # one run of a subset reported 1295/2580 statements, and the same
    # subset split into two shards and merged reported 1295/2580. A faster
    # gate that quietly measured less would be worse than a slow one.
    test-shards:
        name: test-shard ${{ matrix.shard }}/8
        runs-on: ubuntu-latest
        strategy:
            # One shard's failure must not cancel the others: the point is
            # to see every failure in one round, not the first one.
            fail-fast: false
            matrix:
                shard: [1, 2, 3, 4, 5, 6, 7, 8]
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Clean delendai cache
              run: rm -rf .cache/delendai

            - name: Run shard ${{ matrix.shard }} of 8
              run: |
                  set -euo pipefail
                  bun run test:shard -- \
                    --shard=${{ matrix.shard }}/8 \
                    --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json

            - name: Upload this shard's blob report
              uses: actions/upload-artifact@v4
              with:
                  name: vitest-blob-${{ matrix.shard }}
                  path: .vitest-reports/
                  retention-days: 1
                  if-no-files-found: error
                  # `.vitest-reports` starts with a dot, and this action
                  # treats every dot-path as hidden and skips it — so the
                  # first sharded run uploaded nothing and failed with
                  # "No files were found", after the shard had already
                  # done all the work.
                  include-hidden-files: true

    tests:
        name: tests
        runs-on: ubuntu-latest
        needs: test-shards
        # `always()` so a failed shard still reaches the merge: the
        # coverage verdict is worth having even when a spec is red, and
        # the merge reports the shard failures too rather than hiding them
        # behind a skipped job.
        if: always()
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Collect every shard's blob report
              uses: actions/download-artifact@v4
              with:
                  pattern: vitest-blob-*
                  merge-multiple: true
                  path: .vitest-reports

            - name: Merge the shards and enforce the coverage gate
              run: |
                  set -euo pipefail
                  bun run test:merged

            # The gate prints four percentages; deciding what to COVER
            # needs the per-file report, and re-running a 12-minute suite
            # locally to get it is the kind of waste this job just
            # removed. `always()` because the report matters most on the
            # run that failed.
            - name: Upload the merged coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report
                  path: .cache/coverage/
                  retention-days: 3
                  if-no-files-found: warn
                  # `.cache` is a dot-path too — see the shard upload.
                  include-hidden-files: true

    quality-gate:
        name: quality-gate
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run configured quality scopes
              run: bun run quality:gate

    verify-runtime:
        name: verify-runtime
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Run runtime and packaging verification
              run: |
                  set -euo pipefail
                  bun run verify:tools
                  bun run verify:plugin-wiring:advisory
                  bun run verify:cache
                  bun run verify:external-install
                  bun run verify:scaffolds
                  bun run verify:dev-bundles
                  bun run verify:host-capability-packs

    tokens-budget-real:
        name: tokens-budget-real
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Gate the real preset token budgets
              run: |
                  set -euo pipefail
                  bun run tokens:gate
                  bun run tokens:dashboard:check

    manifests-check:
        name: manifests-check
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Validate manifest metadata and generated manifest outputs
              run: |
                  set -euo pipefail
                  bun run lint:plugin-manifest
                  bun run lint:manifest-vs-package
                  bun run lint:manifest-vs-presets
                  bun run generate:from-manifests --check

    generated-artifacts-check:
        name: generated-artifacts-check
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Verify generated artifacts stay in sync
              run: bun run check:generated

    site:
        # c00088: astro-check (lint:web) provably misses build-only
        # resolution failures — the site build has broken twice with every
        # other gate green (04b13fcb vite alias shadowing, 7dae147b f00102).
        # Building the real site is the only gate for that class.
        name: web site build
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Build the web site
              run: bun run site

    pack-smoke:
        name: pack smoke (publishable packages)
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            # Compile publishable dist/ (Node-runnable .js + .d.ts). `files: ["dist"]`
            # means the tarball is empty unless this runs first.
            - name: Build dist
              run: bun run build

            # The published CLI must run under plain Node (npx/npm/pnpm/yarn), not
            # only bun — guard that the compiled bin starts and resolves its deps.
            # Use a literal block + JSON variable so the YAML parser doesn't read
            # the inner `:` as a nested mapping key.
            - name: Smoke — Node runs the compiled CLI
              env:
                  EXPECTED: '"ok": true'
              run: |
                  set -euo pipefail
                  output="$(node packages/core/dist/cli.js --check --plugins=)"
                  echo "$output"
                  echo "$output" | grep -qF "$EXPECTED"

            # Functional smoke: connect an MCP client to the compiled CLI over stdio
            # under Node and call a real tool (overview). Proves the published artifact
            # serves the protocol, not just that the bin starts.
            - name: Smoke — Node serves the compiled CLI over stdio
              run: bun tools/scripts/smoke/cli.script.ts

            # Tarball install e2e: pack core + two plugins, install into a clean project
            # with npm, and drive the INSTALLED CLI under Node — proves the published
            # packages resolve each other via plain node resolution (the M3 risk).
            - name: Smoke — install from tarball and load plugins
              run: bun tools/scripts/smoke/pack.script.ts

            # `npm pack --dry-run` resolves each package's `files`/`exports` and
            # fails if a published tarball would be missing or malformed — a cheap
            # guard that the closed `exports` surface (R13) still packs cleanly.
            - name: Pack each publishable package
              run: |
                  set -euo pipefail
                  for dir in packages/core plugins/*; do
                    if [ -f "$dir/package.json" ]; then
                      echo "::group::pack $dir"
                      ( cd "$dir" && npm pack --dry-run )
                      echo "::endgroup::"
                    fi
                  done

    metrics-gate:
        name: metrics longitudinal regression gate (f00027)
        runs-on: ubuntu-latest
        steps:
            # Bootstraps the local composite action — see the first job.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Build dist
              run: bun run build

            # Fetches the metrics snapshot attached to the previous GitHub
            # release. Resolves gracefully (no failure) if this is the very
            # first tagged release — the gate starts enforcing on the second one.
            - name: Fetch baseline snapshot
              env:
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  METRICS_BASELINE_OUT: metrics-baseline.json
              run: bun tools/scripts/metrics/get-baseline.script.ts

            # Drives the compiled CLI over stdio, calls every read-only/compact
            # tool 3 times to average out single-run jitter, and persists a
            # candidate snapshot.
            - name: Collect candidate snapshot
              env:
                  METRICS_CANDIDATE_PATH: .cache/delendai/metrics/candidate.json
              run: bun tools/scripts/metrics/collect-candidate.script.ts

            # Diffs candidate vs baseline; fails the job (non-zero exit) if any
            # tool regresses beyond the configured threshold (default +20%).
            # Posts the markdown table as the job summary either way.
            - name: Diff snapshots against threshold
              env:
                  METRICS_BASELINE_PATH: metrics-baseline.json
                  METRICS_CANDIDATE_PATH: .cache/delendai/metrics/candidate.json
                  METRICS_TOKEN_DELTA_PCT: '20'
                  METRICS_LATENCY_DELTA_PCT: '20'
                  METRICS_BYTES_DELTA_PCT: '20'
              run: bun tools/scripts/metrics/diff-snapshots.script.ts

    delendai-rebuild-digest:
        name: delendai-rebuild-digest
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify rebuild digest parity
              run: bun tools/scripts/ci/rebuild-digest.script.ts

    sqlite-cutover-ready:
        name: sqlite-cutover-ready
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            # The bun-only SQLite specs. `bun:sqlite` has no node
            # resolution, so these cannot run in the vitest `tests` job;
            # without this step they were excluded from vitest and run by
            # nothing at all, which is how the first production SQLite
            # writer would have ended up with zero enforced coverage.
            - name: Run the bun-only SQLite suite
              run: bun run test:sqlite

            - name: Run SQLite cutover readiness gate
              run: bun run sqlite:cutover-ready

    build-clean:
        name: build-clean
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Build from an empty output tree
              run: bun run build:clean

    # Single aggregate branch-protection check. Naming sixteen individual
    # jobs as required checks is brittle both ways: renaming a job here
    # silently drops it from the required set, and adding a job here
    # silently protects nothing until someone remembers to also add it to
    # `.github/branch-protection.ts`. This job `needs` every job above and
    # is the ONLY one branch protection has to name — the source of truth
    # for "did CI pass" lives in this one `needs` list, not duplicated in
    # the branch-protection config.
    #
    # `if: always()` makes this job itself run even when a dependency
    # failed (otherwise GitHub would just skip it, and a skipped required
    # check blocks merging forever — the opposite of what we want: a red
    # dependency must show up as a red aggregate, not a stuck one). The
    # step then explicitly fails unless every dependency's result is
    # `success` — `skipped` and `cancelled` do not count, so a job that
    # never ran (misconfigured trigger, cancelled run) cannot slip a merge
    # through silently.
    delendai-validate:
        name: delendai-validate
        if: always()
        needs:
            - lint-biome
            - lint-architecture
            - lint-presets
            - lint-docs
            - lint-security
            - lint-governance
            - typecheck
            - test-shards
            - tests
            - quality-gate
            - verify-runtime
            - delendai-rebuild-digest
            - sqlite-cutover-ready
            - build-clean
            - tokens-budget-real
            - manifests-check
            - generated-artifacts-check
            - site
            - pack-smoke
            - metrics-gate
            # x00534: a governance check that nothing depends on gates nothing.
            - develop-protection-live
            - ref-lifecycle
        runs-on: ubuntu-latest
        steps:
            # This job runs `bun`, so it needs a checkout (to have the scripts
            # on disk at all) and a Bun toolchain (to run them). It had neither
            # until 2026-09-10: every run exited 127 with `bun: command not
            # found`, and because this job IS the single required check for
            # develop, nothing could merge into develop at all.
            #
            # Deliberately NOT `./.github/actions/setup-bun-repo`: both scripts
            # below are zero-import (they read `CI_NEEDS_JSON` and nothing
            # else), so a `bun install` here would only make the one check that
            # gates every merge depend on the health of the dependency graph it
            # is supposed to be reporting on. Checkout + Bun is the whole
            # requirement.
            - name: Checkout (the summary scripts live in this repo)
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Summarize every CI gate
              env:
                  CI_NEEDS_JSON: ${{ toJSON(needs) }}
              run: bun tools/scripts/ci/validate-summary.script.ts

            - name: Verify required checks ran successfully
              env:
                CI_NEEDS_JSON: ${{ toJSON(needs) }}
              run: bun tools/scripts/ci/required-run-freshness.script.ts

    # Separate from the declarative `delendai-validate` check: this job asks
    # GitHub for the live develop rule and catches protected=false or drift in
    # required checks.
    #
    # x00534: this job used to `exit 0` when BRANCH_PROTECTION_TOKEN was absent,
    # which made it green without having verified anything — the exact
    # "green = property proven OR unable to verify" pattern this repo's own
    # governance rules exist to eliminate. A governance check has three
    # outcomes: PASS, FAIL and NOT_EXECUTABLE, and in governance CI
    # NOT_EXECUTABLE counts as FAIL. If we cannot hold the credential that
    # proves the property, we cannot certify the property.
    #
    # The single named escape hatch is a fork: `github.repository_owner`
    # differs from the upstream owner there, and a fork cannot hold the
    # upstream's admin secret. That condition cannot be met by accident on the
    # origin repository.
    #
    # The job carries no job-level `if`. `delendai-validate` treats a `skipped`
    # dependency as a failure (a job that never ran must not slip a merge
    # through), so a job-level condition would turn every `main` run red. The
    # branch condition lives inside the step instead, where "this run is not
    # about develop" is an explicit PASS rather than an absent result.
    # The guard existed for a day before anything ran it, and in that day
    # two branches appeared outside every namespace the policy knows —
    # `agent/*` and `wip/*`, both pushed as pull-request heads. The
    # classifier caught both the moment it was finally invoked. A rule
    # nobody executes is a rule nobody follows, which is the whole reason
    # this repository prefers mechanism to documentation.
    ref-lifecycle:
        name: ref-lifecycle
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            # Read-only: it classifies refs and reports. Reaping a spent
            # ref is a separate, deliberate `--reap` that CI never passes.
            - name: Every ref belongs to somebody
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run lint:ref-lifecycle

            # Reporting is not refusing. This checks that the forge still
            # REFUSES a branch created outside the policy's namespaces —
            # the only mechanism here that prevents rather than describes.
            - name: The forge still refuses the names the policy forbids
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run lint:namespace-ruleset

    develop-protection-live:
        name: develop-protection-live
        runs-on: ubuntu-latest
        steps:
            - name: Checkout (required to run the guard)
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            # No `bun install`. The guard is deliberately import-lean:
            # it reaches `repoRoot()` through `tools/scripts/lib/repo-root.ts`
            # rather than the `monorepo-paths` barrel, whose
            # `@delendai/core/public` import transitively loads
            # `@modelcontextprotocol/sdk` and made this step die with
            # `Cannot find module '@modelcontextprotocol/sdk/server/mcp.js'`.
            # A governance check that can only run when the workspace
            # installs cleanly is worth least exactly when it is needed
            # most, so keep the dependency-free property rather than
            # adding an install here.
            - name: Verify live develop protection
              env:
                  GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  IS_FORK: ${{ github.event.pull_request.head.repo.fork || false }}
                  TARGETS_DEVELOP: ${{ github.ref == 'refs/heads/develop' || github.base_ref == 'develop' }}
              run: |
                  set -euo pipefail
                  if [ "${TARGETS_DEVELOP}" != "true" ]; then
                    echo "develop-protection-live: this run does not target develop; nothing to verify."
                    exit 0
                  fi
                  if [ -z "${GH_TOKEN:-}" ]; then
                    if [ "${IS_FORK}" = "true" ]; then
                      echo "develop-protection-live: NOT_EXECUTABLE on a fork (no access to the upstream admin secret) — not treated as a failure."
                      exit 0
                    fi
                    echo "develop-protection-live: NOT_EXECUTABLE — BRANCH_PROTECTION_TOKEN is not configured on this repository."
                    echo "A governance check cannot certify a property it was unable to test, so this counts as a failure."
                    echo "Fix: add a repository-admin token as the BRANCH_PROTECTION_TOKEN secret."
                    exit 1
                  fi
                  bun tools/scripts/lint/branch-protection-guard.script.ts --live
