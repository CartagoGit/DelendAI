# affected.yml — c00138 (Track G, audit §30, §49).
#
# Computes the transitive set of workspaces affected by the
# current PR or push and writes two artifacts:
#
#   - build/ci/affected.json  — full structured report.
#   - build/ci/.affected-set  — newline-joined workspace names,
#                               the lightweight filter consumed by
#                               tier1.yml.
#
# Downstream tier workflows (tier1.yml) read these artifacts via
# `actions/upload-artifact` + `actions/download-artifact`. The
# full-matrix workflows (ci.yml, quality-gate.yml) keep running
# unchanged — the goal is to add fast feedback, not to replace
# coverage.
#
# Triggers:
#   pull_request to develop/main (matches tier1's surface).
#   push to develop.
#   workflow_dispatch (manual reruns).

name: affected

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: affected-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-affected:
    name: detect-affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute affected set
        id: affected
        # `--base` is the PR base SHA on pull_request events and
        # the previous commit on push events. `HEAD` resolves to
        # `github.event.pull_request.head.sha` implicitly when
        # the checkout ref points at the head commit.
        run: |
          set -eu
          BASE_REF="HEAD~1"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          fi
          bun tools/scripts/ci/affected.script.ts \
            --base "$BASE_REF" \
            --head  HEAD \
            --output build/ci/affected.json \
            --set-file build/ci/.affected-set

      - name: Upload affected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: affected-set
          path: |
            build/ci/affected.json
            build/ci/.affected-set
          if-no-files-found: error
