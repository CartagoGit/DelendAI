name: keep-the-queue-moving

# Every merge into the integration branch leaves every other open pull
# request behind it, and the branch rule requires candidates to be up to
# date — which is what stops two independently green pull requests from
# combining into a red one. The forge's auto-merge does NOT refresh them;
# it waits for somebody to press "Update branch".
#
# For one person with one pull request that is a button. For agents
# landing small slices it is a queue that stops after the first merge and
# stays stopped until a human notices — which defeats the point of arming
# auto-merge at all.
#
# Refreshing a candidate is NOT done here, and deliberately so: a branch
# updated by this workflow's own token produces a bot commit, and the
# forge parks the runs it triggers as `action_required` — the candidate
# then sits permanently unmergeable with nothing red on it (#99, measured:
# twenty-one parked runs across five pull requests). The push that the
# forge will build has to come from the machine that owns the work.
#
# So this job REPORTS: which candidates are stale, which armed ones are
# red, and it ends non-zero when the queue is stuck, because a stuck queue
# that reports success is a stuck queue nobody sees (x00557).

on:
    push:
        branches: [develop]
    # A merge is not the only way a candidate goes stale or red. One that
    # was opened and then abandoned never sees a push to the integration
    # branch, so without a clock it is exactly the pull request nobody
    # ever hears about again.
    schedule:
        - cron: '17 * * * *'
    # Also available by hand, for the case where a run was missed.
    workflow_dispatch:

concurrency:
    group: keep-the-queue-moving
    cancel-in-progress: false

permissions:
    contents: write
    pull-requests: write
    # `update-branch` writes its commit as a bot, and the forge will not
    # start workflows on a bot's commit — it parks them as
    # `action_required`. Without this the job can refresh a candidate and
    # still leave it permanently unmergeable, because its required check
    # never runs at all.
    actions: write

jobs:
    report-stale-candidates:
        name: report-stale-candidates
        runs-on: ubuntu-latest
        steps:
            # Checkout + Bun + INSTALL. This job used to stop at Bun, which
            # was enough for the queue script and not for the reaper: the
            # reaper resolves the development policy through core, and core
            # reaches `@modelcontextprotocol/sdk`. Every run after that
            # import landed died on `Cannot find module`, so a merged ref
            # (#193's) was never deleted and lingered in every clone.
            # `lint:workflow-runner-bootstrap` now reads a step's import
            # graph and refuses a job like the old one.
            - name: Checkout (required to resolve the local composite action)
              uses: actions/checkout@v7

            - name: Setup repo (checkout + bun + install)
              uses: ./.github/actions/setup-bun-repo

            - name: Report candidates that are behind, and the armed ones that are red
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun tools/scripts/forge/keep-the-queue-moving.script.ts

            # The other half of keeping the queue moving: a ref whose
            # pull request is finished has delivered whatever it was
            # going to, and leaving it behind is how the namespace fills
            # with branches nobody can tell from live work.
            #
            # `--reap` exists, is tested, and had no caller: the CI job
            # that classifies refs says in its own comment that reaping
            # is "a separate, deliberate `--reap` that CI never passes".
            # Measured when this step was added: 28 merged branches on
            # the forge, the oldest 20 pull requests back.
            #
            # Here and not in `ref-lifecycle`, because this is the
            # workflow that runs AFTER a merge lands — which is the
            # moment a ref becomes reapable — and because that job is
            # read-only on purpose. The guard deletes only refs whose
            # pull request is finished AND whose content the integration
            # branch provably contains; a ref with no pull request is
            # never touched, since it may be the only copy of somebody's
            # work.
            - name: Reap the refs whose pull requests are finished
              env:
                  GH_TOKEN: ${{ github.token }}
              run: bun run lint:ref-lifecycle -- --reap
