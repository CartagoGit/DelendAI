name: Release

# Release on request, never as a side effect of landing code.
#
# `derive-version` reads the Conventional Commits since the last `vX.Y.Z`
# tag and decides the next version (feat→minor, fix/perf→patch,
# BREAKING→major; only docs/chore → no release; non-conventional with
# content → patch). If there is something to release it validates,
# builds, publishes every PUBLISH_ORDER package to npm in dependency
# order at the derived version, tags `vX.Y.Z` and opens a GitHub
# Release. The package count derives from
# tools/scripts/release/release-plan.ts (spec-guarded) — never hardcode it
# here; a previous revision of this comment said "10" while 24 shipped.
#
# Tag-driven: the bump is NOT committed back to main (no CI loop, no fight with
# branch protection) — the tag is the source of truth for the next derivation.
#
# Requires the `NPM_TOKEN` repository secret (Granular access token with
# Bypass 2FA enabled). Since November 2025, npm removed legacy/automation
# tokens and caps write tokens at 90 days — rotate via
# `.github/workflows/rotate-npm-token.yml`.

on:
    # DELIBERATE: a push to `main` no longer publishes.
    #
    # This used to be `push: branches: [main]` — "auto-release on every
    # push to main, el usuario no hace nada". That made merging the
    # promotion pull request the same act as publishing 61 packages to
    # the public npm registry, and the two are not the same decision:
    # `main` carrying the code is a statement about this repository,
    # publishing is a statement to everybody else. With no `vX.Y.Z` tag
    # in existence yet, the first such merge would have been the
    # project's first public release, derived automatically, at 0.1.1.
    #
    # Releasing is now something somebody asks for, in one of two ways:
    #   - push a `vX.Y.Z` tag, which is also what `derive-version` reads
    #     as the anchor for the NEXT version; or
    #   - run this workflow by hand from the Actions tab.
    #
    # Nothing else changed: the same derivation, the same PUBLISH_ORDER,
    # the same validate-build-publish-tag chain.
    push:
        tags: ['v*']
    workflow_dispatch:

# Allow tagging + creating releases, and npm provenance.
permissions:
    contents: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        name: publish + tag + release
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # need full history + tags to derive the next version

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            # A tag push and a manual run are NOT the same decision, and
            # sharing one derivation made the advertised tag trigger
            # unable to publish: the checkout sits on the tag, so the
            # range the derivation reads is empty and every publish step
            # below was skipped (x00557 S3). A tag run publishes exactly
            # the version its tag names — after proving the tag points at
            # the commit being built, so a tag moved after the fact
            # cannot publish a different tree than the one it labels.
            - name: A release tag must point at the commit being built
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  tagged="$(git rev-list -n 1 "${GITHUB_REF#refs/tags/}")"
                  if [ "$tagged" != "$GITHUB_SHA" ]; then
                      echo "release: ${GITHUB_REF#refs/tags/} points at $tagged, not at $GITHUB_SHA." >&2
                      exit 1
                  fi

            - name: Decide the version to publish
              id: decide
              run: bun tools/scripts/release/derive-version.script.ts --github-output

            - name: Install dependencies
              if: steps.decide.outputs.release == 'true'
              run: bun install --frozen-lockfile

            - name: Configure npm auth
              if: steps.decide.outputs.release == 'true'
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Set version, validate, build and publish (PUBLISH_ORDER, in order)
              if: steps.decide.outputs.release == 'true'
              env:
                  VERSION: ${{ steps.decide.outputs.version }}
              # --tool=npm --provenance: `id-token: write` (above) lets npm attach an
              # OIDC-backed provenance attestation to each published tarball. Safe to
              # switch from `bun publish`: every package's `workspace:*` reference to
              # `@delendai/core` lives only in `devDependencies` (never published),
              # and `peerDependencies` already carry a resolved `^X.Y.Z` range via
              # `--write` (see scripts/release.ts header for the full rationale).
              run: bun run release --set="$VERSION" --write --publish --tool=npm --provenance

            # A tag run is triggered BY the tag it would create. `git tag`
            # then fails on an existing name and `set -e` kills the job
            # AFTER npm has published — a half-completed release that ends
            # red (x00561). The tag that started the run is reused; only a
            # manual run creates one.
            - name: Tag the release commit
              if: steps.decide.outputs.release == 'true'
              env:
                  VERSION: ${{ steps.decide.outputs.version }}
              run: |
                  set -euo pipefail
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                      tagged="$(git rev-list -n 1 "v$VERSION")"
                      if [ "$tagged" != "$GITHUB_SHA" ]; then
                          echo "release: v$VERSION already exists and points at $tagged, not at $GITHUB_SHA." >&2
                          exit 1
                      fi
                      echo "release: v$VERSION already exists on this commit; reusing it."
                  else
                      git tag "v$VERSION"
                  fi
                  git push origin "v$VERSION" || {
                      remote="$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)"
                      if [ "$remote" = "$(git rev-parse "v$VERSION^{commit}")" ] ||
                         [ "$remote" = "$(git rev-parse "v$VERSION")" ]; then
                          echo "release: v$VERSION is already on the remote at this commit."
                      else
                          echo "release: could not push v$VERSION." >&2
                          exit 1
                      fi
                  }

            - name: Create GitHub Release
              if: steps.decide.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.decide.outputs.version }}
              run: |
                  set -euo pipefail
                  gh release create "v$VERSION" \
                    --title "v$VERSION" \
                    --generate-notes
