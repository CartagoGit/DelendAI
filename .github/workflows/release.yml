name: Release

# Two acts, kept apart because they are two decisions (x00937).
#
# 1. GitHub Release — automatic. A push to `main` whose lockstep version
#    has no `vX.Y.Z` tag yet tags the pushed commit and opens its GitHub
#    Release, with that version's CHANGELOG section as notes
#    (`release:notes`), as a full release marked latest: a version on
#    `main` is a release, not a preview. Every promotion carries a
#    version and its section (`release:prepare`, checked by
#    `release-pr-gate`), so every version that reaches main is released
#    without anyone pushing a tag. A push whose version is already tagged
#    does nothing.
#
# 2. npm — the owner's decision, never a side effect. Nothing goes to the
#    public registry until the owner says the product is ready (2026-10-23:
#    "until we have a base beta"). Publishing runs only from a manual run
#    with `publish_npm: true`; no tag and no merge publishes. On 2026-10-23
#    a pushed `v0.2.0` tag started publishing 61 packages and had to be
#    cancelled mid-validate.
#
# The package count derives from tools/scripts/release/release-plan.ts
# (spec-guarded) — never hardcode it here.
#
# npm needs the `NPM_TOKEN` repository secret (Granular access token with
# Bypass 2FA enabled), rotated via `.github/workflows/rotate-npm-token.yml`.

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            publish_npm:
                description: 'Publish the tagged version to npm (the owner decides; leave off for a GitHub Release only)'
                type: boolean
                default: false

permissions:
    contents: write
    id-token: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    github-release:
        name: tag + GitHub Release
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: The version main carries
              id: version
              run: |
                  set -euo pipefail
                  version="$(node -p "require('./packages/core/package.json').version")"
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                      echo "tagged=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "tagged=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Tag the commit that carries the new version
              if: steps.version.outputs.tagged == 'false'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" "$GITHUB_SHA" -m "delendai $VERSION"
                  git push origin "v$VERSION"

            # A new version always gets its Release; a manual run refreshes
            # the notes of the current one from the CHANGELOG and makes it a
            # full, latest release if it was left a pre-release. A run the
            # push event never started is dispatched by the queue (x00954).
            - name: Create or refresh the GitHub Release from the CHANGELOG
              if: steps.version.outputs.tagged == 'false' || github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  bun tools/scripts/release/release-notes.script.ts --version="$VERSION" > notes.md
                  if gh release view "v$VERSION" >/dev/null 2>&1; then
                      gh release edit "v$VERSION" --notes-file notes.md --prerelease=false --latest
                  else
                      gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md --latest
                  fi

    npm:
        name: publish to npm (owner's decision)
        needs: github-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm == true
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  ref: v${{ needs.github-release.outputs.version }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Configure npm auth
              run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
              env:
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

            # --tool=npm --provenance: `id-token: write` (above) lets npm attach an
            # OIDC-backed provenance attestation to each published tarball. Every
            # package's `workspace:*` reference to `@delendai/core` lives only in
            # `devDependencies` (never published), and `peerDependencies` carry a
            # resolved `^X.Y.Z` range via `--write`.
            - name: Validate, build and publish (PUBLISH_ORDER, in order)
              env:
                  VERSION: ${{ needs.github-release.outputs.version }}
              run: bun run release --set="$VERSION" --write --publish --tool=npm --provenance
