name: rehearsal-ci

# Rendered by the integration plugin's rehearsal for run r20261113-001246.
on:
    pull_request:
        branches: ['delendai/rehearsal/r20261113-001246/one-pr-integration']
    push:
        branches: ['delendai/rehearsal/r20261113-001246/one-pr-integration']

permissions:
    contents: read

jobs:
    rehearsal-ci:
        name: rehearsal-ci
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Conclude as the pull request declares
              env:
                  HEAD_REF: ${{ github.head_ref }}
                  RUN_DIR: rehearsal/r20261113-001246
              run: |
                  if [ -z "$HEAD_REF" ]; then echo "push: nothing declared"; exit 0; fi
                  declaration="$RUN_DIR/${HEAD_REF##*/}.json"
                  if [ ! -f "$declaration" ]; then echo "no declaration at $declaration"; exit 1; fi
                  seconds=$(jq -r '.seconds' "$declaration")
                  result=$(jq -r '.result' "$declaration")
                  echo "declared: $result after ${seconds}s"
                  sleep "$seconds"
                  [ "$result" = success ]
