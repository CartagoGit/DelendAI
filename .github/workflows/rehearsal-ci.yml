name: rehearsal-ci

# Rendered by the integration plugin's rehearsal for run r20261117-101704-g2.
on:
    pull_request:
        branches: ['delendai/rehearsal/r20261117-101704-g2/authored-conflict-integration']
    push:
        branches: ['delendai/rehearsal/r20261117-101704-g2/authored-conflict-integration']

permissions:
    contents: read

jobs:
    rehearsal-ci:
        name: rehearsal-ci
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - name: Conclude as the pull request declares
              env:
                  HEAD_REF: ${{ github.head_ref }}
                  RUN_DIR: rehearsal/r20261117-101704-g2
              run: |
                  if [ -z "$HEAD_REF" ]; then echo "push: nothing declared"; exit 0; fi
                  declaration="$RUN_DIR/${HEAD_REF##*/}.json"
                  if [ ! -f "$declaration" ]; then
                      # Not a declared member: a batch, red when any declaration in its tree says so.
                      failing=$(find "$RUN_DIR" -name '*.json' -exec cat {} + | jq -s '[.[] | select(.batch == "failure")] | length')
                      echo "batch: $failing declaration(s) fail a batch"
                      [ "$failing" = 0 ]
                      exit $?
                  fi
                  seconds=$(jq -r '.seconds' "$declaration")
                  result=$(jq -r '.result' "$declaration")
                  echo "declared: $result after ${seconds}s"
                  sleep "$seconds"
                  [ "$result" = success ]

    integration-signal:
        name: integration-signal
        needs: [rehearsal-ci]
        if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/delendai/rehearsal/r20261117-101704-g2/authored-conflict-integration')) }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            actions: write
            contents: read
        steps:
            - name: Wake the integrator
              env:
                  GH_TOKEN: ${{ github.token }}
                  BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
                  PULL_REQUEST: ${{ github.event.pull_request.number }}
                  PROMOTE: ${{ github.event_name == 'push' && 'true' || '' }}
              run: |
                  if [ -z "${PROMOTE:-}" ]; then
                    QUEUED=$(gh run list --workflow land.yml --repo "${GITHUB_REPOSITORY}" \
                      --branch "${BRANCH}" --limit 30 --json status,displayTitle,createdAt --jq \
                      '[.[] | select(.status | IN("queued", "pending", "waiting", "requested")) | select(.displayTitle | endswith("-pass-" + $ENV.BRANCH)) | select((.createdAt | fromdateiso8601) > (now - 120))] | length') || QUEUED=0
                    if [ "${QUEUED:-0}" != "0" ]; then
                      echo "a pass is already queued for ${BRANCH}; it reads everything when it starts"
                      exit 0
                    fi
                  fi
                  gh workflow run land.yml \
                    --ref "${BRANCH}" --repo "${GITHUB_REPOSITORY}" \
                    -f pr="${PULL_REQUEST}" -f promote="${PROMOTE}" \
                    || echo "::warning::could not wake the integrator"
