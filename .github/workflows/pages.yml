name: Pages

# Builds and deploys the documentation site to GitHub Pages on every push to
# main. The site (apps/web) is generated from the LIVE tool registry in --strict
# mode, so an undocumented tool fails the build and the web can never silently
# drift behind the code.
#
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
#
# Until that is done the site is still built in strict mode, which is the
# check, and the publishing steps are skipped with a notice. They used to
# run anyway and fail with "Get Pages site failed: Not Found", so every
# promotion left a red run on main for a setting nobody had chosen yet
# (2026-10-07, x00879 S12).

on:
    push:
        branches: [main]

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        name: build site
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            enabled: ${{ steps.pages.outputs.enabled }}
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Is GitHub Pages enabled?
              id: pages
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "::notice title=Pages not enabled::the site is built and checked, not published. Enable it in Settings → Pages → Source = GitHub Actions."
                  fi

            - name: Configure Pages
              if: steps.pages.outputs.enabled == 'true'
              uses: actions/configure-pages@v6

            # The site imports the public API, which resolves to dist/.
            - name: Build dist
              run: bun run build

            - name: Generate site (strict — fails on an undocumented tool)
              env:
                  ASTRO_TELEMETRY_DISABLED: '1'
              run: bun run site:strict

            - name: Upload Pages artifact
              if: steps.pages.outputs.enabled == 'true'
              uses: actions/upload-pages-artifact@v5
              # Astro emits the static site to `build/apps/web/` (see AGENTS.md
              # → "Build / dist layout"). The old `apps/web/dist/` path is no
              # longer the source of truth.
              with:
                  path: build/apps/web

    deploy:
        name: deploy
        needs: build
        if: needs.build.outputs.enabled == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
