# drift.yml — c00133 (AUD-P0-003).
#
# NOT a required status check. `.github/branch-protection.ts` is the
# source of truth and declares `develop` deliberately unprotected — an
# open snapshot journal a swarm pushes to — with `main` as the protected
# release boundary, where the single required aggregate is `ci-complete`.
# This comment used to claim the opposite, which sent more than one
# reader looking for a protection rule that does not exist.
#
# It runs every generator and fails when the working tree drifts from
# what the generators produce, which is a correctness signal regardless
# of whether anything is gated on it.

name: drift

on:
    # Into `develop` only: a pull request into `main` is the release
    # promotion, whose head is `develop` itself, so the push trigger
    # below already ran this on the very same commit. See the note in
    # `ci.yml` for the measurement.
    pull_request:
        branches: [develop]
    push:
        branches: [develop]
    schedule:
        - cron: '0 5 * * *' # nightly at 05:00 UTC
    workflow_dispatch:

concurrency:
    group: drift-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    drift:
        name: drift
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run drift check
              id: drift_check
              continue-on-error: true
              run: bun run gen:all:check

            - name: Capture drift diff
              if: steps.drift_check.outcome == 'failure'
              run: |
                  mkdir -p .artifacts/drift
                  git status --short > .artifacts/drift/git-status.txt
                  git diff --binary --stat --patch > .artifacts/drift/git-diff.patch

            - name: Upload drift artifact (when check fails)
              if: steps.drift_check.outcome == 'failure'
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: drift-diff
                  path: .artifacts/drift
                  if-no-files-found: error

            - name: Fail on drift
              if: steps.drift_check.outcome == 'failure'
              run: exit 1
