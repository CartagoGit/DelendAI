# drift.yml — c00133 (AUD-P0-003).
#
# Required status check on `develop` and `main` (see
# `.github/branch-protection.ts`). Runs every generator and fails
# the PR when the working tree drifts from what the generators
# produce.

name: drift

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  schedule:
    - cron: '0 5 * * *' # nightly at 05:00 UTC
  workflow_dispatch:

concurrency:
  group: drift-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run drift check
        run: bun tools/scripts/gen-all.script.ts --check

      - name: Upload drift artifact (when check fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drift-diff
          path: |
            docs/mcp-vertex/agent-catalog.generated.json
            docs/mcp-vertex/generated/plugin-manifests.generated.json
            docs/mcp-vertex/generated/permission-matrix.generated.json
            docs/mcp-vertex/generated/plugin-docs.generated.json
            apps/web/src/generated/web-catalog.generated.ts
          if-no-files-found: ignore
