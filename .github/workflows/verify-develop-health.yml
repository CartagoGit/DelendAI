# verify-develop-health.yml — v00125.
#
# Nightly job that reads the real GitHub state of `develop` +
# `main`, compares it against the declared policy, and creates
# an issue when drift is detected. Also writes the JSON report
# to `apps/web/src/data/develop-health.json` so the dashboard
# surfaces the latest verified state.

name: verify-develop-health

on:
  schedule:
    - cron: '15 5 * * *' # nightly at 05:15 UTC (after drift at 05:00)
  workflow_dispatch:

concurrency:
  group: verify-develop-health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify-develop-health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run health verifier
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun tools/scripts/ci/verify-develop-health.script.ts \
            --repo ${{ github.repository }} \
            --output apps/web/src/data/develop-health.json
        continue-on-error: true

      - name: Create issue on drift
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.verify.outputs }}
        run: |
          gh issue create \
            --label ci-health,governance \
            --title "develop branch protection drift detected (v00125)" \
            --body "The nightly \`verify-develop-health\` job detected drift between the declared policy and the live GitHub state. Run \`bun tools/scripts/ci/verify-develop-health.script.ts --repo ${{ github.repository }}\` locally to inspect the report."
        continue-on-error: true

      - name: Commit the report
        if: always()
        run: |
          if git diff --quiet apps/web/src/data/develop-health.json; then
            echo "no changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add apps/web/src/data/develop-health.json
            git commit -m "chore(v00125): refresh develop-health report"
            git push
          fi
        continue-on-error: true
