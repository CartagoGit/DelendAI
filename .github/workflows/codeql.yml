# codeql.yml — f00050 S8.
#
# CodeQL static analysis on push and pull_request targeting `main` and
# `develop`, and on demand.
# Uses the `security-and-quality` query pack so we get both
#   - security vulns (SQLi, command injection, path traversal, SSRF…)
#   - quality / maintainability rules (duplicated code, dead code…)
# on the same run. The `bun` autogen step is excluded so the scanner
# only sees first-party TypeScript.
name: CodeQL

on:
  # The integration branch too: an alert is reported when it is introduced,
  # and develop reaches main with none open (x00879 S5). Before, only main
  # was analysed, so 48 alerts reached the owner long after their code
  # landed on develop.
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
