name: Surface Bootstrap

on:
    push:
        branches: [main, develop]
    # Into `develop` only: a pull request into `main` is the release
    # promotion, whose head is `develop` itself, so the push trigger
    # above already ran this on the very same commit. See the note in
    # `ci.yml` for the measurement.
    pull_request:
        branches: [develop]

jobs:
    measure-bootstrap:
        name: measure-bootstrap
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Measure surface bootstrap
              run: bun tools/scripts/measure/bootstrap.script.ts
