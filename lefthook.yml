# Lefthook — git hooks for @mcp-vertex/core
# Docs: https://lefthook.dev/configuration/
#
# Install: `bun install` runs `prepare` → `lefthook install` automatically.
# Skip with `LEFTHOOK=0 git commit ...` or `git commit --no-verify`.
#
# Policy: commit and push discipline is blocking. Formatting and style checks
# remain advisory; commit naming, branch policy, and push destinations are
# correctness gates and must fail before Git creates or publishes history.
#
# Lefthook is the ONLY owner of `.git/hooks/*` in this repo. The staged-file
# Biome formatter runs as the `format-staged` command below
# (`tools/scripts/hooks/pre-commit.ts`); it used to be a raw
# `.git/hooks/pre-commit` that silently clobbered lefthook's hook and
# disabled every check in this file. `tools/scripts/sync-git-hooks.script.ts`
# (run by `prepare` before `lefthook install`) removes those legacy raw hooks.

min_version: 1.7.0
no_tty: false
colors: true

# Sourced by every generated .git/hooks/* before lefthook itself runs.
# Neutralises an unusable inherited locale (LC_ALL=en_US.UTF-8 forwarded from
# a Windows SSH/VS Code client into a WSL box that only has C.UTF-8), which
# made every hook command print
#   /usr/bin/bash: warning: setlocale: LC_ALL: cannot change locale (en_US.UTF-8)
# Changing this line requires re-running `bunx lefthook install -f`, because
# the `rc` path is baked into the generated hook scripts.
rc: tools/scripts/hooks/lefthook-rc.sh

pre-commit:
    parallel: true
    commands:
        # Staged-file Biome formatter (x00088). The script filters staged
        # files itself and re-stages the formatted bytes; it NEVER blocks
        # the commit (Biome CI mode in `bun run validate` is the gate).
        format-staged:
            run: bun tools/scripts/hooks/pre-commit.ts || true
            stage_fixed: false

        # Regenerate the quantitative snapshot embedded in
        # AGENT-BOOTSTRAP.md and re-stage it. `check:quantitative` (in
        # `bun run validate`) compares that block, and its numbers move
        # whenever anyone adds a spec or a tool — which, with a swarm of
        # agents committing continuously, means the gate goes red for
        # everyone minutes after any commit. A generated artifact should be
        # REGENERATED at commit time, not asserted after the fact; the
        # validate-time check stays as the backstop for a host that
        # bypassed the hook. Never blocks.
        quantitative-refresh:
            glob:
                - '**/*.spec.ts'
                - 'plugins/*/src/**'
                - 'packages/core/src/**'
                - 'docs/mcp-vertex/AGENT-BOOTSTRAP.md'
            run: bun tools/scripts/gen/quantitative.script.ts >/dev/null 2>&1 || true
            stage_fixed: true

        # Report git stashes. This repo's policy is that stashes are
        # forbidden — in a shared worktree they are the same hazard as a
        # zombie lock: work an agent left behind, invisible to everyone
        # else, and a source of `git apply` conflicts when two hooks run at
        # once.
        #
        # LEFTHOOK MAKES ONE ITSELF. When a pre-commit hook runs while any
        # file is PARTIALLY staged (same path has staged AND unstaged
        # hunks), lefthook hides the unstaged hunks in a stash titled
        # exactly `lefthook auto backup` and restores it when the run
        # finishes. Verified against lefthook 2.1.10 in a throwaway repo:
        # it fires on partial staging alone (not on `stage_fixed`), it does
        # not fire when the staged and unstaged files are different, and if
        # the run is INTERRUPTED (SIGINT / tool timeout / killed agent) the
        # stash is never restored and dangles forever with real work in it.
        #
        # There is NO way to turn that off. The complete option set of
        # lefthook 2.1.10, read out of the binary's own struct tags, has no
        # `no_stash`, no `hide_unstaged`, and no LEFTHOOK_* env killswitch
        # (the only ones it reads are LEFTHOOK, LEFTHOOK_BIN,
        # LEFTHOOK_CONFIG, LEFTHOOK_EXCLUDE, LEFTHOOK_OUTPUT,
        # LEFTHOOK_VERBOSE). An earlier `no_stash: true` here was silently
        # ignored — worse than nothing, because it looked configured.
        # Detecting the leftover is the only available mitigation.
        #
        # Because this check runs as a CHILD of lefthook, it always sees
        # lefthook's own live backup. Reporting that would be a violation
        # caused by the guard's own runner, so the script classifies:
        # a `lefthook auto backup` stash is transient (ignored) only while a
        # lefthook process is alive AND it is seconds old; an older one, or
        # one with no lefthook running, is reported loudly as unrestored
        # work with the `git stash pop` command to recover it. Everything
        # else is a real developer/agent stash and a violation.
        #
        # ADVISORY on purpose, and NOT in `bun run validate`. A stray stash
        # must not block a commit that is otherwise fine, and it must never
        # make validate red — a red validate blocks every agent in the swarm
        # from closing anything, which is a far worse failure than the one
        # being reported.
        no-stashes-advisory:
            run: bun run lint:no-stashes || true
            stage_fixed: false

        # Validate BEM + nested SCSS rules on staged SCSS files. Advisory:
        # violations are printed but do NOT block the commit; the same
        # check runs in `bun run validate` and CI.
        # Skips silently when no SCSS files are staged.
        lint-scss-staged:
            glob:
                - 'apps/web/src/**/*.scss'
            run: bun run lint:scss || true
            stage_fixed: false

        # f00056: the checked-in agent catalog must match its live sources
        # (tools from the plugin registry, skills from the manifest, proposals
        # from the cache index). BLOCKING (no `|| true`) — a stale artifact is
        # a correctness bug and CI gates the same check via `bun run validate`.
        # Skips gracefully only when the regenerable proposal index is missing
        # (fresh checkout): the artifact cannot be verified without it.
        # Bypass: LEFTHOOK_BYPASS=1 git commit ...
        catalog-drift-check:
            glob:
                - 'packages/core/skills/**'
                - 'docs/mcp-vertex/proposals/**'
                - 'docs/mcp-vertex/agent-catalog.generated.json'
                - 'plugins/*/src/**'
                - 'packages/core/src/**'
            # REGENERATE, don't just assert. The catalog embeds live
            # proposal counts, so it goes stale the moment any agent moves
            # a proposal — and with a swarm closing proposals continuously
            # the check was red for everyone within minutes of any commit.
            # Since `catalog:check` runs inside `bun run validate`, and a
            # passing validate is the evidence `close_slice` /
            # `proposal_transition` require, a stale generated artifact
            # blocked every OTHER proposal from closing. A generated file
            # should be regenerated at commit time; the validate-time check
            # stays as the backstop for a host that bypassed the hook.
            #
            # The id counter is reseeded here for the same reason:
            # `lint:proposal-id-drift` compares it against the highest id on
            # disk, so it falls behind the moment anyone authors a proposal,
            # and it lives in gitignored per-machine state that no commit
            # could ever carry.
            run: 'if [ -f .cache/mcp-vertex/proposals/index.json ]; then bun run sync:proposals >/dev/null && bun tools/scripts/proposals/sync-proposal-counters.script.ts >/dev/null && bun tools/scripts/catalog/generate-agent-catalog.script.ts --mode=compact >/dev/null; else echo "catalog-drift-check: skipped (proposal index not present yet)"; fi'
            stage_fixed: true

        host-hints-drift-check:
            glob:
                - 'docs/mcp-vertex/agent-catalog.generated.json'
                - 'tools/scripts/catalog/render-host-hints.script.ts'
                - 'docs/mcp-vertex/host-hints/agent-instructions.generated.md'
            run: bun run catalog:hints:check || true
            stage_fixed: false

        # f00082: catch stray executable files at the repo root and under
        # .cache/mcp-vertex/ before they sneak in. Advisory like the
        # other drift checks — `bun run validate` is the source of truth
        # and will fail the CI run. The hook is here so the agent
        # authoring the commit sees the violation immediately.
        stray-files-check:
            run: bun run lint:stray-cache-files || true

        # f00086: config-driven branch discipline. BLOCKING. With
        # `agentWorktree: false` (this repo), committing on
        # an `agent/*` branch warns the agent to switch back to `develop`;
        # arbitrary working branches are rejected; release/* is the sole
        # operator-created branch for the release PR flow.
        commit-branch-discipline:
            run: bun run lint:commit-branch -- --staged {staged_files}

        # f00083: anti-duplication guard for the universal bootstrap.
        # BLOCKING (no `|| true`). Runs the canonical-scaffold lint
        # against docs/mcp-vertex/AGENT-BOOTSTRAP.md only when that
        # file is staged — the lint is file-scoped, so we don't pay
        # the cost on every commit. Bypass: LEFTHOOK_BYPASS=1
        # git commit ... (documented in the blocker text).
        bootstrap-canonical-discipline:
            glob:
                - 'docs/mcp-vertex/AGENT-BOOTSTRAP.md'
            run: bun run lint:bootstrap-canonical || exit 1

        # f00083: anti-duplication guard for the auto-generated host-
        # hint fragments. BLOCKING (no `|| true`). Runs the fragment
        # content check only when one of the fragments is staged.
        # Bypass: LEFTHOOK_BYPASS=1 git commit ... (documented in
        # the blocker text).
        host-hints-fragments-discipline:
            glob:
                - 'docs/mcp-vertex/host-hints/agent-instructions.generated.md'
            run: bun run lint:host-hints-fragments || exit 1

pre-push:
    parallel: false
    commands:
        # Full-repo format check before pushing. Advisory: prints the
        # unformatted files but never blocks the push.
        format-check-all:
            run: bun run format:all:check || true
        format-check-web:
            run: bun run format:web:check || true
        # Full-site SCSS BEM lint (matches what `bun run validate` runs in CI).
        # Advisory: prints violations but does not block the push.
        lint-scss-all:
            run: bun run lint:scss || true

        # c00133 (AUD-P0-003): drift check on every push. Runs every
        # generator and fails when the working tree has uncommitted
        # drift. BLOCKING (no `|| true`) — a stale checked-in generated
        # artifact is a correctness bug, and this mirrors the GitHub
        # Actions `drift` workflow.
        # Bypass: LEFTHOOK_BYPASS=1 git push ...
        drift-check:
            run: bun tools/scripts/gen-all.script.ts --check

        # f00086: config-driven branch discipline. BLOCKING. With
        # `agentWorktree: false` (this repo), temporary agent/user branches
        # are not valid working locations. Normal work stays on develop;
        # release/* is the sole operator-created branch and reaches main
        # only through a pull request.
        #
        # x00159 S1: `use_stdin: true` is REQUIRED here. Lefthook does not
        # forward git's real stdin to a command by default (it connects a
        # pseudo-TTY instead), so the ref-update lines git's pre-push hook
        # writes to stdin (`<local ref> <local oid> <remote ref>
        # <remote oid>`) never reached this script — it silently fell back
        # to the `{1} {2} {3}` argv template, which lefthook itself cannot
        # populate with a real refspec for a plain `git push` (that data
        # only ever exists on stdin), so `{3}` shipped as the literal,
        # unsubstituted string and the guard never actually blocked
        # anything. Without `use_stdin: true`, do not remove the script's
        # own `process.stdin.isTTY` guard — see the script's header comment.
        push-to-develop-discipline:
            use_stdin: true
            run: bun run lint:push-to-develop -- {1} {2}

        # f00395 S3: gate bloqueante para ramas release/* y main. Solo se
        # activa cuando el ref destino es `main` o empieza por `release/`
        # (el script devuelve 0 sin ejecutar nada si no aplica). Local
        # atrapa antes de subir, CI confirma en PR. Bypass:
        # LEFTHOOK_BYPASS=1 git push ...
        release-pr-gate:
            use_stdin: true
            run: bun run lint:release-pr-gate -- {1} {2} || exit 1

# f00086: commit-msg discipline. Blocking locally so malformed history cannot
# be created and deferred to CI or the release workflow.
commit-msg:
    parallel: false
    commands:
        commit-msg-conventional:
            run: bun run lint:commit-msg -- {1}

# Manual hooks (run with `lefthook run <name>`).
format_web:
    commands:
        format-web:
            run: bun run format:web
