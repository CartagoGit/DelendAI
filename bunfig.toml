[install]
hoist = ["vitest", "typescript", "@types/bun", "@types/node", "zod", "@modelcontextprotocol/sdk"]

# x01095: a version younger than three days (259200 s) is not installed, so a
# compromised release removed within hours or days never reaches the tree
# before the advisory databases know it.
minimumReleaseAge = 259200

[run]
# r00045 S4: force every `bun` invocation to inject the source condition.
# Without this, `bun tools/scripts/...` resolves `@delendai/<pkg>` against
# the per-package `dist/` (now under `build/`) instead of `src/`, and
# `gen-all --check` runs against stale compiled artefacts. The condition is
# already declared in `tsconfig.base.json#customConditions`, but tsconfig
# only affects tsc — bun resolves via its own loader.
conditions = ["@delendai/source"]

[test]
runner = "bun"
coverage = false
# x00162 S2: registers scss-plugin.ts globally so any `bun test` spec
# that transitively imports a `.scss` file (shared webview-rendering
# helpers) gets the same default+compiledCss export shape the
# production Bun.build() bundle already produces via that same
# plugin — without this, those specs fail with
# "Export named 'compiledCss' not found".
# It also refuses any spec that is not Bun's to judge (vitest owns the
# rest; see tools/scripts/test/bun-owned-preload.ts).
preload = [
	"./tools/scripts/compile/scss-preload.ts",
	"./tools/scripts/test/bun-owned-preload.ts",
]
