# Project-scoped Codex config. Codex CLI and the Codex IDE extension both read
# `.codex/config.toml` in trusted repos, so this makes the repo MCP tools
# available without each Codex user hand-editing `~/.codex/config.toml`.
#
# Paths are relative to this `.codex/` directory; `cwd = ".."` starts the MCP
# server from the repo root, so the host script path resolves the same way as
# in the other checked-in MCP clients (.mcp.json, .vscode/mcp.json).
#
# Like those clients, this launches the repo-local host source (`bun
# tools/scripts/host/host-server.script.ts`) while `@mcp-vertex/cli` is not
# published to npm; switch back to the published `bunx` launch on release.

[mcp_servers.mcp-vertex]
command = "bun"
args = ["tools/scripts/host/host-server.script.ts", "--workspace=."]
cwd = ".."
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "auto"
